<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <filter id="shadowRed" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.2" flood-color="#dc2626" />
    </filter>
  </defs>

  <!-- Circular Base Badge (Prohibition Sign Style) -->
  <circle cx="60" cy="60" r="54" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
  <circle cx="60" cy="60" r="48" fill="url(#bgGradRed)" stroke="#dc2626" stroke-width="2"/>

  <!-- Glove Silhouette Inside -->
  <g id="glove-graphic">
    <!-- Cuff of Glove -->
    <rect x="42" y="70" width="34" height="12" rx="2" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
    <line x1="42" y1="74" x2="76" y2="74" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- Palm & Fingers of Glove -->
    <!-- Thumb -->
    <path d="M 43 68 C 36 64, 32 54, 38 48 C 42 44, 46 48, 48 55 Z" fill="#64748b" stroke="#334155" stroke-width="1.5"/>
    <!-- Index Finger -->
    <path d="M 49 54 L 50 36 C 50 32, 55 32, 55 36 L 55 52 Z" fill="#64748b" stroke="#334155" stroke-width="1.5"/>
    <!-- Middle Finger -->
    <path d="M 55 50 L 56 31 C 56 27, 61 27, 61 31 L 62 50 Z" fill="#64748b" stroke="#334155" stroke-width="1.5"/>
    <!-- Ring Finger -->
    <path d="M 62 50 L 63 34 C 63 30, 68 30, 68 34 L 68 52 Z" fill="#64748b" stroke="#334155" stroke-width="1.5"/>
    <!-- Pinky Finger -->
    <path d="M 68 53 L 70 41 C 70 37, 75 37, 75 41 L 74 62 Z" fill="#64748b" stroke="#334155" stroke-width="1.5"/>
    <!-- Palm Area -->
    <path d="M 44 68 C 44 56, 48 52, 74 54 L 75 70 Z" fill="#475569"/>
    
    <!-- Entanglement Alert Sparks near rotating chuck -->
    <path d="M 33 42 L 28 38 M 31 46 L 24 47" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Universal Prohibition Slash Ring (ISO 7010) -->
  <circle cx="60" cy="58" r="38" fill="none" stroke="#dc2626" stroke-width="7" filter="url(#shadowRed)"/>
  <line x1="33" y1="31" x2="87" y2="85" stroke="#dc2626" stroke-width="7" stroke-linecap="round"/>

  <!-- Sub-label Badge -->
  <rect x="30" y="86" width="60" height="15" rx="7.5" fill="#dc2626" filter="url(#shadowRed)"/>
  <text x="60" y="97" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="800" fill="#ffffff" text-anchor="middle">BAHAYA FATAL</text>
</svg>
