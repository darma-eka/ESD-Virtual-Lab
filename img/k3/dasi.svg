<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradRed3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <filter id="shadowRed3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.2" flood-color="#dc2626" />
    </filter>
  </defs>

  <!-- Circular Base Badge -->
  <circle cx="60" cy="60" r="54" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
  <circle cx="60" cy="60" r="48" fill="url(#bgGradRed3)" stroke="#dc2626" stroke-width="2"/>

  <!-- Hanging Necktie & Loose Cloth Graphic -->
  <g id="tie-graphic">
    <!-- Shirt Collar Top -->
    <path d="M 45 28 L 54 38 L 47 38 L 39 30 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <path d="M 75 28 L 66 38 L 73 38 L 81 30 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>

    <!-- Tie Knot -->
    <polygon points="55,36 65,36 63,44 57,44" fill="#1e3a8a" stroke="#172554" stroke-width="1.2"/>

    <!-- Tie Body Hanging Down & Swirling -->
    <path d="M 57 44 L 63 44 L 69 68 L 74 74 L 60 82 L 48 72 L 53 66 Z" 
          fill="#2563eb" stroke="#1e40af" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Diagonal Stripes on Tie -->
    <line x1="56" y1="48" x2="64" y2="52" stroke="#facc15" stroke-width="1.8"/>
    <line x1="54" y1="56" x2="66" y2="60" stroke="#facc15" stroke-width="1.8"/>
    <line x1="52" y1="64" x2="68" y2="68" stroke="#facc15" stroke-width="1.8"/>

    <!-- Entanglement Danger Rotation Swirl (Machine spindle drawing tie in) -->
    <path d="M 72 54 C 82 54, 86 64, 80 72 C 76 76, 70 76, 68 74" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="3 2"/>
    <polygon points="73,50 69,56 76,56" fill="#dc2626"/>
  </g>

  <!-- Universal Prohibition Slash Ring (ISO 7010) -->
  <circle cx="60" cy="58" r="38" fill="none" stroke="#dc2626" stroke-width="7" filter="url(#shadowRed3)"/>
  <line x1="33" y1="31" x2="87" y2="85" stroke="#dc2626" stroke-width="7" stroke-linecap="round"/>

  <!-- Sub-label Badge -->
  <rect x="28" y="86" width="64" height="15" rx="7.5" fill="#dc2626" filter="url(#shadowRed3)"/>
  <text x="60" y="97" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="800" fill="#ffffff" text-anchor="middle">TERLILIT SPINDEL</text>
</svg>
