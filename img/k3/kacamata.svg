<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#7dd3fc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.85" />
    </linearGradient>
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Circular Base Badge -->
  <circle cx="60" cy="60" r="54" fill="#f0f9ff" stroke="#bae6fd" stroke-width="2"/>
  <circle cx="60" cy="60" r="48" fill="url(#bgGrad1)" filter="url(#shadow1)"/>

  <!-- ISO Safety Sign Inner Ring -->
  <circle cx="60" cy="60" r="45" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="3 2"/>

  <!-- Safety Goggles Strap -->
  <path d="M 24 58 Q 60 76 96 58" fill="none" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
  <path d="M 23 58 Q 60 76 97 58" fill="none" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round"/>

  <!-- Left Eyepiece Outer Frame -->
  <path d="M 28 50 C 28 42, 38 38, 54 40 C 56 47, 56 65, 50 72 C 38 74, 28 66, 28 50 Z" 
        fill="#ffffff" stroke="#0f172a" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- Right Eyepiece Outer Frame -->
  <path d="M 92 50 C 92 42, 82 38, 66 40 C 64 47, 64 65, 70 72 C 82 74, 92 66, 92 50 Z" 
        fill="#ffffff" stroke="#0f172a" stroke-width="2" stroke-linejoin="round"/>

  <!-- Bridge Connector -->
  <rect x="52" y="44" width="16" height="6" rx="3" fill="#cbd5e1" stroke="#0f172a" stroke-width="2"/>

  <!-- Left Lens Glass -->
  <path d="M 32 50 C 32 44, 40 42, 51 43 C 52 50, 52 62, 47 67 C 38 68, 32 62, 32 50 Z" 
        fill="url(#lensGrad)"/>

  <!-- Right Lens Glass -->
  <path d="M 88 50 C 88 44, 80 42, 69 43 C 68 50, 68 62, 73 67 C 82 68, 88 62, 88 50 Z" 
        fill="url(#lensGrad)"/>

  <!-- Light Reflection Highlights (Glossy) -->
  <path d="M 35 46 Q 44 45 48 48" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 72 48 Q 76 45 85 46" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="36" cy="58" r="2" fill="#ffffff" opacity="0.8"/>
  <circle cx="84" cy="58" r="2" fill="#ffffff" opacity="0.8"/>

  <!-- Protective Side Shields (Ventilation holes) -->
  <circle cx="26" cy="52" r="1.2" fill="#ffffff"/>
  <circle cx="26" cy="56" r="1.2" fill="#ffffff"/>
  <circle cx="94" cy="52" r="1.2" fill="#ffffff"/>
  <circle cx="94" cy="56" r="1.2" fill="#ffffff"/>

  <!-- Sub-label Badge -->
  <rect x="36" y="86" width="48" height="15" rx="7.5" fill="#ffffff" filter="url(#shadow1)"/>
  <text x="60" y="97" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#0369a1" text-anchor="middle">K3 APD</text>
</svg>
