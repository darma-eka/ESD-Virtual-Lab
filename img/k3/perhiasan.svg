<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradRed2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <filter id="shadowRed2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.2" flood-color="#dc2626" />
    </filter>
  </defs>

  <!-- Circular Base Badge -->
  <circle cx="60" cy="60" r="54" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
  <circle cx="60" cy="60" r="48" fill="url(#bgGradRed2)" stroke="#dc2626" stroke-width="2"/>

  <!-- Metal Watch & Ring Graphic -->
  <g id="jewelry-graphic">
    <!-- Watch Strap Top -->
    <rect x="42" y="27" width="16" height="15" rx="2" fill="#64748b" stroke="#334155" stroke-width="1.2"/>
    <line x1="42" y1="32" x2="58" y2="32" stroke="#94a3b8" stroke-width="1"/>
    <line x1="42" y1="37" x2="58" y2="37" stroke="#94a3b8" stroke-width="1"/>

    <!-- Watch Strap Bottom -->
    <rect x="42" y="66" width="16" height="15" rx="2" fill="#64748b" stroke="#334155" stroke-width="1.2"/>
    <line x1="42" y1="71" x2="58" y2="71" stroke="#94a3b8" stroke-width="1"/>
    <line x1="42" y1="76" x2="58" y2="76" stroke="#94a3b8" stroke-width="1"/>

    <!-- Watch Case Round -->
    <circle cx="50" cy="54" r="16" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
    <circle cx="50" cy="54" r="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <!-- Watch Crown Knob -->
    <rect x="66" y="52" width="3" height="4" rx="1" fill="#475569"/>
    <!-- Watch Hands -->
    <line x1="50" y1="54" x2="50" y2="46" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="50" y1="54" x2="56" y2="54" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="50" cy="54" r="1.5" fill="#ef4444"/>

    <!-- Gold Ring next to watch -->
    <ellipse cx="76" cy="50" rx="9" ry="12" fill="none" stroke="#eab308" stroke-width="3"/>
    <ellipse cx="76" cy="50" rx="6" ry="9" fill="none" stroke="#ca8a04" stroke-width="1"/>
    <!-- Diamond / Gem on top of ring -->
    <polygon points="76,36 80,40 76,44 72,40" fill="#38bdf8" stroke="#0284c7" stroke-width="1"/>
  </g>

  <!-- Universal Prohibition Slash Ring (ISO 7010) -->
  <circle cx="60" cy="58" r="38" fill="none" stroke="#dc2626" stroke-width="7" filter="url(#shadowRed2)"/>
  <line x1="33" y1="31" x2="87" y2="85" stroke="#dc2626" stroke-width="7" stroke-linecap="round"/>

  <!-- Sub-label Badge -->
  <rect x="32" y="86" width="56" height="15" rx="7.5" fill="#dc2626" filter="url(#shadowRed2)"/>
  <text x="60" y="97" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="800" fill="#ffffff" text-anchor="middle">DILARANG</text>
</svg>
