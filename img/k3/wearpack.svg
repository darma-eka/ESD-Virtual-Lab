<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="clothGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="hiVisGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Circular Base Badge -->
  <circle cx="60" cy="60" r="54" fill="#f0f9ff" stroke="#bae6fd" stroke-width="2"/>
  <circle cx="60" cy="60" r="48" fill="url(#bgGrad2)" filter="url(#shadow2)"/>
  <circle cx="60" cy="60" r="45" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="3 2"/>

  <!-- Wearpack Torso Outline -->
  <g filter="url(#shadow2)">
    <!-- Neck Opening -->
    <path d="M 52 32 Q 60 40 68 32 L 84 36 L 94 56 L 82 62 L 78 52 L 78 84 L 42 84 L 42 52 L 38 62 L 26 56 L 36 36 Z" 
          fill="url(#clothGrad)" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- High-Vis Scotchlite Reflective Stripes (Across Chest & Shoulders) -->
    <path d="M 37 46 L 47 48 L 47 52 L 34 50 Z" fill="url(#hiVisGrad)"/>
    <path d="M 83 46 L 73 48 L 73 52 L 86 50 Z" fill="url(#hiVisGrad)"/>
    <rect x="42" y="56" width="36" height="4.5" fill="url(#hiVisGrad)"/>
    <rect x="42" y="58" width="36" height="1.5" fill="#ffffff" opacity="0.8"/>

    <!-- Center Zipper Placket -->
    <line x1="60" y1="40" x2="60" y2="84" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="60" y1="42" x2="60" y2="84" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>

    <!-- Pockets on Chest -->
    <rect x="45" y="64" width="11" height="10" rx="1.5" fill="#1e40af" stroke="#ffffff" stroke-width="1"/>
    <line x1="45" y1="66" x2="56" y2="66" stroke="#facc15" stroke-width="1.5"/>
    <rect x="64" y="64" width="11" height="10" rx="1.5" fill="#1e40af" stroke="#ffffff" stroke-width="1"/>
    <line x1="64" y1="66" x2="75" y2="66" stroke="#facc15" stroke-width="1.5"/>

    <!-- Collar -->
    <!-- Left Lapel -->
    <polygon points="52,32 60,42 54,42 46,34" fill="#3b82f6" stroke="#ffffff" stroke-width="1.2"/>
    <!-- Right Lapel -->
    <polygon points="68,32 60,42 66,42 74,34" fill="#3b82f6" stroke="#ffffff" stroke-width="1.2"/>

    <!-- Cuffs / Buttoned Sleeves (Tied/Tightly buttoned) -->
    <rect x="25" y="54" width="12" height="4" rx="1" fill="#3b82f6" transform="rotate(-30 31 56)"/>
    <rect x="83" y="54" width="12" height="4" rx="1" fill="#3b82f6" transform="rotate(30 89 56)"/>
  </g>

  <!-- Sub-label Badge -->
  <rect x="36" y="86" width="48" height="15" rx="7.5" fill="#ffffff" filter="url(#shadow2)"/>
  <text x="60" y="97" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#0369a1" text-anchor="middle">WEARPACK</text>
</svg>
